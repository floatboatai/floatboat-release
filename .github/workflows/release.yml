name: Windows installer regression (RC4 to RC5)

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Only validate the diagnostic report on one Windows runner"
        type: boolean
        required: false
        default: false

      fixture_only:
        description: "Only compile and exercise the candidate NSIS TEMP helper"
        type: boolean
        required: false
        default: false
      instrument_helper:
        description: "Diagnostic tracing of the candidate helper (not acceptance)"
        type: boolean
        required: false
        default: false
      regression_scope:
        description: "Full installer matrix or focused default-TEMP baseline"
        type: choice
        required: false
        default: all
        options: [all, baseline]

permissions:
  contents: read
  actions: read

jobs:
  installer-regression:
    if: inputs.fixture_only != true
    name: Installer regression (${{ matrix.scenario }})
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.diagnostics_only && '["selftest"]' || (inputs.regression_scope == 'baseline' && '["baseline"]' || '["baseline","long-temp","external-lock","apostrophe-temp"]')) }}
    steps:
      - name: Checkout isolated diagnostic tooling
        uses: actions/checkout@v4

      - name: Verify diagnostic report file locks and output junctions
        shell: pwsh
        timeout-minutes: 5
        run: |
          & ./.github/diagnostics/windows-installer-report-selftest.ps1 `
            -ReportScript "$env:GITHUB_WORKSPACE/.github/diagnostics/windows-installer-report.ps1" `
            -OutputDirectory "$env:GITHUB_WORKSPACE/evidence/${{ matrix.scenario }}/report-selftest"

      - name: Download signed RC4 installer
        if: inputs.diagnostics_only != true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41804743562
          name: desktop-windows-x64-floatboat
          path: installers/rc4

      - name: Download signed RC5 installer
        if: inputs.diagnostics_only != true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41812625426
          name: desktop-windows-x64-floatboat
          path: installers/rc5

      - name: Exercise real signed installers
        if: inputs.diagnostics_only != true
        shell: pwsh
        run: |
          & ./.github/diagnostics/windows-installer-regression.ps1 `
            -Scenario '${{ matrix.scenario }}' `
            -InstallerRC4 "$env:GITHUB_WORKSPACE/installers/rc4/Floatboat-Setup-0.6.3-rc.4-x64.exe" `
            -InstallerRC5 "$env:GITHUB_WORKSPACE/installers/rc5/Floatboat-Setup-0.6.3-rc.5-x64.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE/evidence/${{ matrix.scenario }}" `
            -ReportScript "$env:GITHUB_WORKSPACE/.github/diagnostics/windows-installer-report.ps1"

      - name: Upload diagnostics even when a scenario fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-regression-${{ matrix.scenario }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error

  upgrade-temp-fixture:
    if: inputs.fixture_only == true
    name: Candidate NSIS upgrade TEMP helper
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout isolated diagnostic tooling
        uses: actions/checkout@v4

      - name: Download and verify pinned NSIS
        shell: pwsh
        timeout-minutes: 4
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.0.4.1.7z'
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'floatboat-nsis-3.0.4.1'
          Invoke-WebRequest -Uri 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z' -OutFile $archive
          $stream = [IO.File]::OpenRead($archive)
          $sha = [Security.Cryptography.SHA512]::Create()
          try { $digest = [Convert]::ToBase64String($sha.ComputeHash($stream)) } finally { $stream.Dispose(); $sha.Dispose() }
          if ($digest -ne 'VKMiizYdmNdJOWpRGz4trl4lD++BvYP2irAXpMilheUP0pc93iKlWAoP843Vlraj8YG19CVn0j+dCo/hURz9+Q==') { throw 'NSIS archive checksum mismatch' }
          & 7z x $archive "-o$nsisRoot" -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          "FLOATBOAT_FIXTURE_NSIS_ROOT=$nsisRoot" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Compile and exercise candidate helper in Windows PowerShell 5.1
        shell: powershell
        timeout-minutes: 8
        env:
          FLOATBOAT_FIXTURE_INSTRUMENT: ${{ inputs.instrument_helper }}
        run: |
          & ./.github/diagnostics/upgrade-temp-fixture/run-fixture.ps1 `
            -HelperPath "$env:GITHUB_WORKSPACE/.github/diagnostics/upgrade-temp-fixture/installer-upgrade-temp.nsh" `
            -NsisRoot $env:FLOATBOAT_FIXTURE_NSIS_ROOT `
            -OutputDirectory "$env:GITHUB_WORKSPACE/evidence/upgrade-temp-helper" `
            -InstrumentHelper:($env:FLOATBOAT_FIXTURE_INSTRUMENT -eq 'true')

      - name: Upload helper fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-temp-helper-fixture
          path: evidence/
          retention-days: 7
          if-no-files-found: error
