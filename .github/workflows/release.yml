name: Windows installer regression (RC4 to RC5)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installer-regression:
    name: Installer regression (${{ matrix.scenario }})
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline, long-temp, external-lock, apostrophe-temp]
    steps:
      - name: Checkout isolated diagnostic tooling
        uses: actions/checkout@v4

      - name: Verify diagnostic report with known Windows file lock
        shell: pwsh
        timeout-minutes: 5
        run: |
          & ./.github/diagnostics/windows-installer-report-selftest.ps1 `
            -ReportScript "$env:GITHUB_WORKSPACE/.github/diagnostics/windows-installer-report.ps1" `
            -OutputDirectory "$env:GITHUB_WORKSPACE/evidence/${{ matrix.scenario }}/report-selftest"

      - name: Download signed RC4 installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41804743562
          name: desktop-windows-x64-floatboat
          path: installers/rc4

      - name: Download signed RC5 installer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41812625426
          name: desktop-windows-x64-floatboat
          path: installers/rc5

      - name: Exercise real signed installers
        shell: pwsh
        run: |
          & ./.github/diagnostics/windows-installer-regression.ps1 `
            -Scenario '${{ matrix.scenario }}' `
            -InstallerRC4 "$env:GITHUB_WORKSPACE/installers/rc4/Floatboat-Setup-0.6.3-rc.4-x64.exe" `
            -InstallerRC5 "$env:GITHUB_WORKSPACE/installers/rc5/Floatboat-Setup-0.6.3-rc.5-x64.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE/evidence/${{ matrix.scenario }}" `
            -ReportScript "$env:GITHUB_WORKSPACE/.github/diagnostics/windows-installer-report.ps1"

      - name: Upload diagnostics even when a scenario fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-regression-${{ matrix.scenario }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
