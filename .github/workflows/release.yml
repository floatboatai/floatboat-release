name: Windows shortcut probe
run-name: Windows shortcut probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Verify Windows shortcut interfaces
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe both path modes in independent processes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('modern', 'default')) {
            $output = Join-Path $env:GITHUB_WORKSPACE ('evidence/' + $mode)
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/diagnostics/windows-upgrade-shortcut-probe.ps1' -OutputDirectory $output -PathMode $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload native probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shortcut-probe-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
