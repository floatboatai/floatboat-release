name: Windows upgrade guard probe
run-name: Windows upgrade guard probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Verify external hardlink guard
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native file guard experiment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File './scripts/diagnostics/windows-upgrade-guard-probe.ps1' -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-guard-probe-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
